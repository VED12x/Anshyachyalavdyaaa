services:
  # Node.js API Service
  - type: web
    name: dc360-api
    env: node
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dc360-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dc360-redis
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: dc360-ml-service
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # Python ML Service
  - type: web
    name: dc360-ml-service
    env: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  # Managed PostgreSQL
  - name: dc360-db
    plan: free
    postgresMajorVersion: 15

# Managed Redis
  # Note: Render free tier Redis is available via the dashboard.
  # If your Render plan supports it in blueprints:
  # - name: dc360-redis
  #   plan: free
