services:
  # Managed PostgreSQL (Standard Postgres, no Timescale needed)
  - type: psql
    name: dc360-db
    plan: free
    postgresMajorVersion: 15

  # Managed Redis (Render provides this natively)
  - type: redis
    name: dc360-redis
    ipAllowList: []
    plan: free

  # Node.js API Service
  - type: web
    name: dc360-api
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dc360-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dc360-redis
          property: connectionString
      - key: ML_SERVICE_URL
        value: https://dc360-ml-service.onrender.com # URL of the Python service
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # Python ML Service
  - type: web
    name: dc360-ml-service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
