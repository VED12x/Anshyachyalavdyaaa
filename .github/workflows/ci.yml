name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: dc360
          POSTGRES_PASSWORD: dc360_dev
          POSTGRES_DB: diabetescare360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./api
        run: npm ci || npm install
      - name: Run tests
        working-directory: ./api
        run: npm test
        env:
          DATABASE_URL: postgresql://dc360:dc360_dev@localhost:5432/diabetescare360
          REDIS_URL: redis://localhost:6379

  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./ml-service
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run tests
        working-directory: ./ml-service
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS dependencies
        working-directory: ./api
        run: npm ci || npm install
      - name: Run ESLint
        working-directory: ./api
        run: npx eslint .
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python Linters
        run: pip install flake8 ruff
      - name: Run Flake8
        working-directory: ./ml-service
        run: flake8 .
      - name: Run Ruff
        working-directory: ./ml-service
        run: ruff check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS dependencies
        working-directory: ./api
        run: npm ci || npm install
      - name: NPM Audit
        working-directory: ./api
        run: npm audit || echo "NPM audit issues found"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: PIP Audit
        working-directory: ./ml-service
        run: pip-audit || echo "pip audit issues found"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        working-directory: ./api
        run: docker build -t api-test -f Dockerfile .
      - name: Build ML Service image
        working-directory: ./ml-service
        run: docker build -t ml-service-test -f Dockerfile .
